# sciforge-desktop CI
#
# 组成：lint（ruff）+ test（pytest）。
#
# 现状说明（依据 2026-09-26 的仓库核对）：
# - 本仓库当前 **0 个测试用例**，无 [tool.pytest.ini_options]，无 dev extras。
#   因此 pytest 步骤显式容忍退出码 5（未收集到用例）并发出 notice，而不是让 CI 变红。
#   待测试基建补齐后，应移除该容忍逻辑。
# - 本仓库 pyproject.toml **无 [tool.ruff] 配置**。lint 作业以 ruff 默认规则集
#   （E4 / E7 / E9 / F）作为基线；补齐配置后可在此处切换为项目配置。
# - PySide6 在 Python 3.14 上无可用 wheel（2026-09-26 实测），因此 GUI 作业
#   与 Python 版本矩阵解耦，独立判定是否可运行，并在不可用时**条件跳过**而非失败。

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一分支的新推送取消旧运行
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # 全局离线：agent/tools.py 在模块导入时读取该变量，用于避免 CI 期间出网。
  SCI_FORGE_OFFLINE: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  # ---------------------------------------------------------------- lint
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装 ruff
        run: |
          python -m pip install --upgrade pip
          python -m pip install "ruff>=0.6"

      - name: ruff check
        run: ruff check --output-format=github .

      - name: 提示（无项目级配置时）
        if: always()
        run: |
          if grep -q '^\[tool\.ruff\]' pyproject.toml 2>/dev/null; then
            echo "已启用 [tool.ruff] 项目配置，ruff 使用仓库配置。"
          else
            echo "::notice::pyproject.toml 中尚无 [tool.ruff] 配置，ruff 以默认规则集运行（E4/E7/E9/F）。补齐配置后可移除本提示。"
          fi

  # ------------------------------------------------------- core（无 PySide6）
  test-core:
    name: Test core (py${{ matrix.python-version }}, no PySide6)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 依据 2026-09-26 实测，PySide6 在 3.14 上无可用 wheel；
        # core 作业不安装 PySide6，因此可覆盖到 3.14。
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装 pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pytest>=8.0"

      - name: import 冒烟（四个不依赖 PySide6 的包）
        # 不使用 pip install -e .：本仓 pyproject 声明了 install_requires = PySide6，
        # 在无 wheel 的 Python 版本上会安装失败；且 entry point 缺包前缀（已知缺陷）。
        # 改为把仓库根加入 PYTHONPATH 直接验证导入。
        run: |
          export PYTHONPATH="${GITHUB_WORKSPACE}"
          python -c "
          import cli.main, agent.tools, sessions.session_store, api.mcp_client
          print('IMPORT OK (core packages)')
          "

      - name: gui 模块懒加载检查（不安装 PySide6）
        # gui/main_window.py 顶层不 import PySide6，懒加载设计应保证无 PySide6 时仍可 import。
        run: |
          export PYTHONPATH="${GITHUB_WORKSPACE}"
          python -c "
          import gui.main_window as m
          assert m.MainWindow._impl is None, 'MainWindow 不应在 import 时被构造'
          print('GUI MODULE IMPORT OK (lazy, no PySide6)')
          "

      - name: 离线模式生效验证
        # 确认 SCI_FORGE_OFFLINE=1 时 web_search 不出网且返回空列表。
        run: |
          export PYTHONPATH="${GITHUB_WORKSPACE}"
          python -c "
          import os
          assert os.environ.get('SCI_FORGE_OFFLINE') == '1', 'CI 环境变量未生效'
          from agent.tools import web_search
          assert web_search('connectivity probe') == [], '离线模式下 web_search 应返回空列表'
          print('OFFLINE MODE OK')
          "

      - name: 路径沙箱冒烟
        run: |
          export PYTHONPATH="${GITHUB_WORKSPACE}"
          python - <<'PY'
          from agent.tools import TOOL_REGISTRY
          r = TOOL_REGISTRY["read_file"]("/")
          assert r["ok"] is False, "读根目录应被沙箱拒绝"
          assert "error" in r, "失败结果应含 error 字段"
          print("SANDBOX OK")
          PY

      - name: AST 语法检查
        run: |
          python -c "import ast,glob; [ast.parse(open(f,encoding='utf-8').read()) for f in glob.glob('**/*.py', recursive=True)]; print('SYNTAX OK')"

      - name: pytest
        # 现状：仓库无测试文件，pytest 退出码 5 表示「未收集到用例」。
        # 显式容忍并提示，待测试基建落地后应删除该分支。
        run: |
          set +e
          python -m pytest -q
          code=$?
          set -e
          if [ "$code" -eq 5 ]; then
            echo "::notice::pytest 未收集到用例（退出码 5）。本仓库当前 0 个测试用例，属已知基建缺口；补齐 tests/ 与 [tool.pytest.ini_options] 后请移除此容忍分支。"
          elif [ "$code" -ne 0 ]; then
            echo "::error::pytest 失败，退出码 $code"
            exit "$code"
          else
            echo "pytest 通过。"
          fi

  # ------------------------------------------------------------------ GUI
  # 条件跳过说明：
  # 1. PySide6 在当前 Python 版本上无可用 wheel 时跳过（2026-09-26：Python 3.14 属此情况）；
  # 2. 无 Qt 平台插件可加载时跳过（改用 offscreen 平台，仍失败则跳过）；
  # 3. 仓库内不存在带 gui 标记的用例时，pytest 退出码 5 亦按跳过处理。
  # 跳过的原因都会通过 ::notice:: 打印，不计为失败。
  test-gui:
    name: Test GUI (conditional, skip if unavailable)
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 探测 PySide6 是否可安装
        id: pyside6
        run: |
          python -m pip install --upgrade pip
          if python -m pip install --only-binary=:all: "PySide6>=6.6"; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "PySide6 wheel 可用，继续 GUI 作业。"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::当前 Python 无可用 PySide6 wheel，GUI 作业条件跳过（不视为失败）。"
          fi

      - name: 探测 Qt offscreen 平台
        id: qt
        if: steps.pyside6.outputs.available == 'true'
        run: |
          set +e
          QT_QPA_PLATFORM=offscreen python -c "
          from PySide6.QtWidgets import QApplication, QLabel
          app = QApplication([])
          QLabel('probe')
          print('QT PLATFORM OK')
          "
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "usable=true" >> "$GITHUB_OUTPUT"
          else
            echo "usable=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Qt 平台插件不可用，GUI 作业条件跳过（不视为失败）。"
          fi

      - name: 安装 pytest
        if: steps.pyside6.outputs.available == 'true' && steps.qt.outputs.usable == 'true'
        run: python -m pip install "pytest>=8.0" "pytest-qt>=4.4"

      - name: 主窗口冒烟（离屏）
        if: steps.pyside6.outputs.available == 'true' && steps.qt.outputs.usable == 'true'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          export PYTHONPATH="${GITHUB_WORKSPACE}"
          python - <<'PY'
          from PySide6.QtWidgets import QApplication
          from gui.main_window import MainWindow

          app = QApplication([])
          w = MainWindow()
          assert w.windowTitle() == "sciforge 桌面客户端", w.windowTitle()
          assert w.nav_list.count() == 3, w.nav_list.count()
          assert [w.nav_list.item(i).text() for i in range(3)] == ["会话", "工具", "设置"]
          print("MAIN WINDOW SMOKE OK")
          PY

      - name: pytest（含 GUI）
        if: steps.pyside6.outputs.available == 'true' && steps.qt.outputs.usable == 'true'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set +e
          python -m pytest -q -p no:cacheprovider
          code=$?
          set -e
          if [ "$code" -eq 5 ]; then
            echo "::notice::未收集到 GUI 用例（退出码 5），按条件跳过处理。当前仓库 0 个测试用例。"
          elif [ "$code" -ne 0 ]; then
            echo "::error::GUI 测试失败，退出码 $code"
            exit "$code"
          fi

  # ------------------------------------------------------- 打包元数据检查
  metadata:
    name: Packaging metadata check
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 报告缺失的可选元数据字段（不阻塞）
        # 已知缺口：无 authors / urls / keywords / classifiers。
        # 此处仅打印提醒，不作为失败条件；补齐后应改为硬性校验。
        run: |
          python - <<'PY'
          import re, pathlib, sys

          text = pathlib.Path("pyproject.toml").read_text(encoding="utf-8")
          optional = ["authors", "maintainers", "urls", "keywords", "classifiers"]
          missing = [f for f in optional if not re.search(rf"^{f}\s*=", text, re.M)]
          if missing:
              print("::notice::pyproject.toml 缺少可选元数据字段：" + ", ".join(missing))
          else:
              print("打包元数据字段齐备。")

          m = re.search(r'^sciforge-desktop\s*=\s*"([^"]+)"', text, re.M)
          if m:
              target = m.group(1)
              module = target.split(":")[0]
              if module in {"cli", "core", "api", "sessions", "agent", "gui"}:
                  print(
                      "::warning::entry point 目标为裸模块名（"
                      + module
                      + "），安装后可能无法导入。此为已知缺陷，详见 README「已知缺陷与待修复项」第 1 条。"
                  )
          sys.exit(0)
          PY
