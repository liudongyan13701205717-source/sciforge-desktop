[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sciforge-desktop"
version = "0.1.0"
description = "sciforge 桌面客户端（PySide6 骨架）"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6",
]

[project.scripts]
sciforge-desktop = "cli.main:main"

[tool.setuptools.packages.find]
include = ["cli*", "core*", "api*", "sessions*", "agent*", "gui*"]